<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="hud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6002e"/>
      <stop offset="50%" stop-color="#7a3cff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- HUD frame -->
  <g stroke="url(#hud)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M24 24 L24 60 M24 24 L60 24"/>
    <path d="M1176 24 L1176 60 M1176 24 L1140 24"/>
    <path d="M24 396 L24 360 M24 396 L60 396"/>
    <path d="M1176 396 L1176 360 M1176 396 L1140 396"/>
  </g>

  <!-- faint circuit / web lines, single consistent motif -->
  <g stroke="#e6002e" stroke-width="1" opacity="0.14">
    <line x1="1200" y1="0" x2="850" y2="420"/>
    <line x1="1200" y1="0" x2="1000" y2="420"/>
    <path d="M1200 90 Q950 90 780 420" fill="none"/>
    <circle cx="1030" cy="200" r="3" fill="#e6002e" opacity="0.5"/>
    <circle cx="900" cy="310" r="3" fill="#00c2ff" opacity="0.5"/>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="1200" height="2" fill="#00c2ff" opacity="0.45">
    <animate attributeName="y" values="0;418;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- identity scan ring, top left -->
  <g transform="translate(90,90)">
    <circle r="34" fill="none" stroke="#1c2130" stroke-width="4"/>
    <circle r="34" fill="none" stroke="url(#hud)" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="214" stroke-dashoffset="214">
      <animate attributeName="stroke-dashoffset" values="214;0" dur="2.2s" fill="freeze"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-family="'Fira Code',monospace" font-size="13" fill="#00c2ff">ID</text>
  </g>

  <text x="150" y="70" font-family="'Fira Code','Consolas',monospace" font-size="14" fill="#00c2ff" opacity="0.9">
    &gt; identity scan
  </text>
  <text x="150" y="92" font-family="'Fira Code','Consolas',monospace" font-size="14" fill="#3ddc84">
    verified — access granted
  </text>
  <text x="150" y="114" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#7a8296">
    neural systems online · spider sense: standby module
  </text>

  <text x="90" y="230" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#hud)" filter="url(#glow)">
    DEVELOPER.OS
  </text>
  <text x="92" y="272" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#9aa1b5" letter-spacing="2">
    AI ENGINEER · DATA BUILDER · SYSTEM ONLINE
  </text>

  <rect x="92" y="300" width="4" height="26" fill="#00c2ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="108" y="322" font-family="'Fira Code','Consolas',monospace" font-size="15" fill="#e6e9f2">
    session ready — awaiting command_
  </text>
</svg>
